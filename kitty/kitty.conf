font_family JetBrainsMono NF Bold
font_size 12.0
bold_font auto
italic_font auto
bold_italic_font auto

background_opacity 0.9
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 4

include colors.conf

# Layout-independent shell editing and clipboard shortcuts.
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf
map alt+backspace send_text all \x1b\x7f
map ctrl+backspace send_text all \x17
map alt+delete send_text all \x1bd
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+с copy_to_clipboard
map ctrl+shift+м paste_from_clipboard
